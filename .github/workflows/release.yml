name: release

# 两条发布路径，共用同一套 relkit 产出：
#   push tag v<semver>     → stable 渠道，并附 GitHub Release
#   workflow_dispatch      → dev 渠道，只发到 relkit
# 每个平台 job 只做到 ArtifactSet 为止，不持 token；publish job 汇总后 stage + release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  MADU_RELEASE_TAG: ${{ github.ref_name }}
  RELKIT_CHANNEL: ${{ github.event_name == 'push' && 'stable' || 'dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node -e 'import("./scripts/version.mjs").then((m) => m.assertVersionsAligned())'
      - run: npm test

  # 唯一领号处：releaseCode 由服务器分配，一次发布只领一次，矩阵共用。
  # x.y.z 取自 src-tauri/tauri.conf.json；stable 时 tag 必须等于 v<version>，否则在领号前失败。
  plan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      code: ${{ steps.release.outputs.code }}
      channel: ${{ steps.release.outputs.channel }}
    env:
      RELKIT_CLI: ${{ github.workspace }}/.relkit/tools/relkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check stable tag against tauri.conf.json
        if: env.RELKIT_CHANNEL == 'stable'
        run: node -e 'import("./scripts/version.mjs").then((m) => m.assertTagMatches(process.env.MADU_RELEASE_TAG, m.readVersion()))'
      - name: Fetch relkit CLI
        run: |
          python scripts/relkit_tool.py --component cli --platform linux-amd64 --out-name relkit
          chmod +x "$RELKIT_CLI"
      - id: release
        name: Claim release code
        run: |
          code="$("$RELKIT_CLI" release-code claim)"
          node scripts/relkit-version.mjs --channel "$RELKIT_CHANNEL" --code "$code"
        env:
          RELKIT_CUSTODY_MANIFEST: relkit.custody.json
          RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}

  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            relkit-target: windows-amd64
            exe: .exe
            installer: "*-setup.exe"
          - os: macos-15
            rust-target: aarch64-apple-darwin
            relkit-target: darwin-arm64
            exe: ""
            installer: "*.dmg"
          - os: macos-15-intel
            rust-target: x86_64-apple-darwin
            relkit-target: darwin-amd64
            exe: ""
            installer: "*.dmg"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
      RELKIT_CLI: ${{ github.workspace }}/.relkit/tools/relkit${{ matrix.exe }}
      RELKIT_OUT: .relkit/out/${{ matrix.relkit-target }}
    steps:
      # changelog 取自 git 历史，三个平台必须看到同一份完整历史才能 merge。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 仓内 .cargo/config.toml 把 crates.io 切到 rsproxy（内网用），GitHub runner 直连官方源更稳
      - run: rm -f src-tauri/.cargo/config.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Fetch relkit CLI
        run: |
          python scripts/relkit_tool.py --component cli --platform ${{ matrix.relkit-target }} --out-name "relkit${{ matrix.exe }}"
          chmod +x "$RELKIT_CLI" || true
      - name: Build Runtime Bootstrap
        run: '"$RELKIT_CLI" bootstrap build --project relkit.project.json --out .relkit/runtime-bootstrap.json'
      - name: Fetch relkit updater + check proto drift
        run: node scripts/stage-relkit.mjs ${{ matrix.rust-target }}
      - name: Produce ArtifactSet
        run: |
          rm -rf "$RELKIT_OUT"
          "$RELKIT_CLI" artifacts produce \
            --version "${{ needs.plan.outputs.version }}" \
            --channel "${{ needs.plan.outputs.channel }}" \
            --target ${{ matrix.relkit-target }} \
            --out-dir "$RELKIT_OUT" \
            --out "$RELKIT_OUT/artifact-set.json"
      - name: Desktop unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust-target }}
      - uses: actions/upload-artifact@v4
        with:
          name: relkit-out-${{ matrix.relkit-target }}
          path: ${{ env.RELKIT_OUT }}
          if-no-files-found: error
      - name: Attach installer to GitHub Release
        if: env.RELKIT_CHANNEL == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELKIT_OUT }}/${{ matrix.installer }}

  # 唯一持 token 的 job：merge → stage → release 必须在同一工作区完成。
  publish:
    needs: [plan, desktop]
    runs-on: ubuntu-latest
    env:
      PYTHON: python
      RELKIT_CLI: ${{ github.workspace }}/.relkit/tools/relkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch relkit CLI
        run: |
          python scripts/relkit_tool.py --component cli --platform linux-amd64 --out-name relkit
          chmod +x "$RELKIT_CLI"
      - uses: actions/download-artifact@v4
        with:
          pattern: relkit-out-*
          path: .relkit/in
      - name: Merge ArtifactSets
        run: |
          rm -rf .relkit/merged
          "$RELKIT_CLI" artifacts merge \
            --in .relkit/in/relkit-out-windows-amd64/artifact-set.json \
            --in .relkit/in/relkit-out-darwin-arm64/artifact-set.json \
            --in .relkit/in/relkit-out-darwin-amd64/artifact-set.json \
            --out .relkit/merged/artifact-set.json
      - name: Stage
        run: '"$RELKIT_CLI" stage --artifact-set .relkit/merged/artifact-set.json'
      - name: Release plan
        run: '"$RELKIT_CLI" release --version "${{ needs.plan.outputs.version }}"'
      - name: Release
        run: '"$RELKIT_CLI" release --version "${{ needs.plan.outputs.version }}" --execute'
        env:
          RELKIT_RELEASE_VIA_CI: "1"
          RELKIT_CUSTODY_MANIFEST: relkit.custody.json
          RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}
