[package]
name = "madureader"
version = "0.1.0"
description = "MaduReader (Ma读) - A minimalistic Markdown reader built with Tauri 2.x and React 19"
authors = ["firoyang"]
edition = "2021"

[lib]
name = "madureader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
